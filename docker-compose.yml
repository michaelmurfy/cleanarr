services:
  cleanarr:
    build: .
    image: cleanarr:latest
    container_name: cleanarr
    restart: unless-stopped
    ports:
      - "7585:7585"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - cleanarr-data:/data
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7585/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  cleanarr-data:
