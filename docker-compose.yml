services:
  cleanarr:
    image: ${CLEANARR_IMAGE:-ghcr.io/michaelmurfy/cleanarr:latest}
    build: .
    container_name: cleanarr
    restart: unless-stopped
    ports:
      - "7585:7585"
    env_file:
      - .env
    volumes:
      - cleanarr-data:/data
      # - ./data:/data  # For those who want to see the data locally
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7585/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cleanarr-data:
